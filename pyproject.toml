[dependency-groups]
dev = [
    "anyio>=4.12.1",
    "pytest>=9.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.0",
]

# pytest
[tool.pytest.ini_options]
anyio_mode = "auto"

# uv
[tool.uv.sources]
remora = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

# pyright
[tool.pyright]
include = ["packages"]
typeCheckingMode = "standard"

# ruff
[tool.ruff]
src = ["packages/*/src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle (ruff default)
    "F",  # pyflakes (ruff default)
    "UP", # pyupgrade (modernize)
    "I",  # isort (sort imports)
]
ignore = ["E501"] # ignore "line too long"
