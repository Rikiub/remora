[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = [
    "ruff==0.16.2", # 0.16.3 PGO optimizations breaks in my ancient computer. Set fixed version for now.
    "ty>=0.0.72",
]
test = ["anyio>=4.12.1", "pytest>=9.0.0", "pytest-mock>=3.15.1"]

# pytest
[tool.pytest]
strict = true
anyio_mode = "auto"
addopts = ["--import-mode=importlib", "-m", "not integration"]
markers = [
    "integration: tests that realize real network calls and access to filesystem",
    "unit: tests that run offline and simulate core operations",
]

# uv
[tool.uv.sources]
remora = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

# pyright
[tool.pyright]
include = ["packages"]
typeCheckingMode = "standard"

# ty
[tool.ty.rules]
unused-type-ignore-comment = "ignore"

# ruff
[tool.ruff]
src = ["packages/*/src"]
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "UP", # pyupgrade (modernize)
    "I",  # isort (sort imports)
]
ignore = [
    "EXE002", # Ignore executable warning
]
