[project]
name = "remora"
version = "3.0.0"
requires-python = ">=3.11"
description = "Download any video/audio you want from a simple URL ✨"
dependencies = [
    "yt-dlp[default,curl_cffi]>=2026.7.4",
    "pydantic>=2.9.2",
    "typing-extensions>=4.12.2",
    "pathvalidate>=3.2.1",
    "loguru>=0.7.3",
    "httpx>=0.28.1",
    "anyio>=4.12.1",
    "lazy-loader>=0.5",
    "platformdirs>=4.11.3",
]

[project.optional-dependencies]
standard = ["yt-dlp[deno]", "ffmpeg-binaries>=1.1.0"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"
