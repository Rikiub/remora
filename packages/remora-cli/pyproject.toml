[project]
name = "remora-cli"
version = "3.0.0"
description = "Download any video/audio you want from a simple URL ✨"
dependencies = ["remora", "rich>=14.0.0", "anyio>=4.12.1", "cyclopts>=4.22.5"]

[project.optional-dependencies]
standard = ["remora[standard]"]

[project.scripts]
remora = "remora_cli:run"

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"
